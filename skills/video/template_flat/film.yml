# film.yml — the single source of truth for one Rental Ninja film (house style: flat vector, Humaaans cast, red banner + watermark).
# Everything not set here falls back to the series defaults in tools/spec.py.
# Worked examples in the skill: reference/film5 (house style, 24 scenes) and reference/film3 (paper-craft).

film:
  slug: my-film                      # file names in final/
  title: My Feature Film             # <title>: a name of 2-4 words
  headline: 'Rental Ninja &middot; <span>one line about the feature</span>'
  subhead: What the viewer will learn
  aria: Animated film about ...
  style: flat                        # flat = the house style (default); paper = paper-craft stop-motion
  format: 16x9                       # 16x9 1920x1080 (web, YouTube, in-app popup) | 9x16 Reels/Stories | 1x1 | 4x5 feed
  # safe: {'9x16': [.14, .2, .06]}   # override the safe-area insets [top, bottom, sides] per format
  lang: en                           # narration language (also the Hub locale)
  poster_offset: 2.2                 # poster frame = DURATION - this (lands on the end card)

captions:                            # burned into every frame (the .srt sidecar is always written)
  # burn: true                       # default: off for 16x9, on for the social formats
  style: pill                        # pill = white bold on navy pills | karaoke = + the spoken word on a red chip
  max_chars: 32                      # per line
  max_lines: 2                       # per page

brief:                               # filled in and approved with the user BEFORE any audio is made
  audience: ''
  goal: ''
  tone: warm, witty, calm
  features: []                       # the list the user approved, in film order
  keep_out: []                       # things the user said not to show or mention
  claims: []                         # {claim, source}: every number or promise on screen needs a source

timing:
  first_line_at: 1.6                 # seconds of music before the first word
  default_gap: 1.35                  # pause after a line unless the line sets gap
  lead: .55                          # a scene's sheet lands this long before its line
  tail: 5.2                          # end card time after the last word

voice:
  engine: hub                        # hub = ElevenLabs through the Hub MCP tool generate_voiceover (no key, billed to the
                                     # company account); elevenlabs = your own key (Keychain or ELEVEN_KEY)
  voice: ''                          # empty = the brand voice for film.lang (Hub tool list_marketing_voices); or an ElevenLabs voice id
  name: ''                           # the voice's name from list_marketing_voices (recorded in the media library rights)
  # from_voice_library: false        # true = a public ElevenLabs Voice Library voice (its owner's terms decide paid ads);
                                     # unset = publish records true ("check first") unless the voice is known
  model: eleven_v4                  # emotive: audio tags in say:, e.g. '[tired] Son las doce... [sighs] [relieved] Con Rental Ninja...'
  # settings: {stability: .5, similarity_boost: .8, use_speaker_boost: true}   # series defaults
  takes: [a, b, c]

lines:
  # text: what the captions show. say: what the voice reads, when it differs (e.g. 'Booking dot com'),
  # including v4 audio tags ([excited], [softly], [sighs], [confident, warm]): one per clause, never shown in captions.
  # pick: the chosen take. gap: pause after the line. settings: per-line ElevenLabs voice settings
  # direction: a note on the delivery (put it into say: as audio tags).
  # split: a long caption breaks before the n-th occurrence of word `at` (back: start that many words earlier).
  - text: First line of the film.
    direction: 'Opening line: gentle, fond.'
  - text: Rental Ninja. Your whole rental business, in one place.
    direction: "Final tagline: slower and warm. 'Rental Ninja' as a brand name, a clear pause, then land the line with a smile."

scenes:                              # the plan: one scene per line or line range; the code lives in app/js/scenes*.js
  - {lines: [1, 1], name: opening, bg: C.sky, idea: 'street with the red banner, host waves'}
  - {lines: [2, 2], name: end card, bg: C.navy, idea: 'endCardScene(2): logo, tagline, CTA, URL'}

end_card: {tagline: 'Your whole rental business, in one place.', cta: Book a demo, url: rental-ninja.com}

# app.scripts defaults to the house-style list in tools/spec.py (STYLE['flat']); add your own scenes_*.js before main_flat.js.

music:
  engine: hub                        # hub = ElevenLabs Music through the Hub MCP tool generate_music (no key, <= 90 s a call:
                                     # longer scores go in parts joined by a crossfade); elevenlabs = your own key;
                                     # library = only the clips below (licensed music)
  # `film.py score <folder> --dry` prints the plan (one chunk per act, ending with the end card at the film's length) + credits.
  # style: [108 BPM, G major, warm playful acoustic pop, marimba melody, ...]   # brand default in tools/spec.py (list or 'a, b, c')
  # negative: [vocals, singing, lyrics, ...]                                     # brand default in tools/spec.py
  # sections:                        # line ranges -> mood; lines left out follow the default problem/turn/features/proof split
  #   - {lines: [1, 4], act: problem}                  # act = intro problem turn features proof outro (its name + mood)
  #   - {lines: [5, 5], name: Calm Breakdown, mood: 'drums drop out, warm sustained guitar chords, relieved'}
  # stops: [{line: 4, word: same, offset: .05}]       # hard stop on a beat, silent until the next chunk starts (or hold: s)
  # seed: 7                          # same plan + seed = a close variation (exact repeats are not guaranteed)
  # prompt: '...'                    # a free-text prompt instead of the plan (no sections, no seed, <= 90 s)
  # crossfade: .8                    # seconds of equal-power crossfade between parts (scores over 90 s)
  # synth: [{script: music/my_cue.py, args: [...]}]   runs first; the script writes a wav into music/
  # clips: [{file: music/sting.wav, at: 12.4}]       # extra clips on top of the composed score (engine library: the whole score)

mix: {}                              # overrides: vo_lufs, music_lufs, sfx_lufs, duck_db, duck_hold, outro_lift {db, from}, ...

rights:                              # media library record (`film.py publish`): voice and music are filled in from the film
  visuals: ''                        # anything beyond the house style: screenshots, photos, stock, cut-outs, and their source
  other: ''                          # anything else that limits use (licensed music clips, a partner's logo, ...)
