# Film 5 — an earlier film re-animated in the house style, on that film's finished mix: its beats land on js/hits.js
# (that mix's foley cue times). Code reference only: the takes and the mix are not shipped, so it does not render as-is.
film:
  slug: rental-ninja-promo-flat
  title: Rental Ninja Flat
  headline: 'Rental Ninja &middot; <span>your whole rental business, in one place</span>'
  subhead: What it is, what it solves, and what it does
  aria: Flat vector animated film about Rental Ninja, the vacation rental management software
  lang: en
  poster_offset: 2.2
  icon: video

brief:
  audience: vacation rental managers who have not heard of Rental Ninja
  goal: what it is, the pain it removes, the top features, social proof, how to start
  tone: warm, witty, calm; problem first (act 1), turn (line 5), features (acts 2-3), proof and CTA (act 4)
  keep_out: [AI website builder]
  claims:               # examples from an older film: re-source any you reuse (a tool result from your session);
                        # counts like '12,500+ properties' no longer go in a film
    - {claim: '12,500+ properties', source: 'https://try.rental-ninja.com'}
    - {claim: '50+ channels', source: 'https://try.rental-ninja.com'}
    - {claim: 'G2 4.9 / Capterra 4.8', source: 'https://try.rental-ninja.com'}
    - {claim: 'onboarding in 24-48 h', source: 'https://try.rental-ninja.com'}

timing: {first_line_at: 1.6, default_gap: 1.35, lead: .55, tail: 5.2, wipe: .34}

voice:
  engine: hub                        # the directions below are delivery notes: put them into say: as audio tags
  takes: [a, b, c]

lines:
  - {text: You started hosting to welcome people., pick: b, direction: 'Opening line: gentle, nostalgic, fond.'}
  - text: But somewhere along the way, the job became browser tabs, spreadsheets, and a phone that never stops.
    pick: a
    gap: 1.3
    direction: A wry, knowing tone, slightly weary; a crisp beat after each item in the list.
    split: {at: browser}
  - text: Prices to update on every site. Messages at midnight. Cleaners to chase. Owners waiting for their numbers.
    pick: b
    gap: 1.3
    direction: Wry and a little breathless, like counting chores on your fingers; four short separate phrases.
    split: {at: cleaners}
  - {text: And one missed update means two guests at the same door., pick: b, gap: 1.9, direction: "Dry, rueful understatement; a small beat before 'two guests at the same door'."}
  - {text: There is a calmer way to run it., pick: a, gap: 1.6, direction: 'A turn: relief, a calm smile, slower and reassuring.'}
  - text: Rental Ninja. One place for your listings, your bookings, your guests, your team, and your money.
    pick: b
    gap: 1.5
    direction: "A proud, bright reveal. 'Rental Ninja' said as a brand name, then a clear pause. Even rhythm through the list of five."
    split: {at: guests, back: 1}
  - text: Create a listing once, and publish it to Airbnb, Booking.com, Vrbo, and more than fifty other channels.
    pick: b
    direction: "Clear and upbeat. Say Vrbo as 'Verbo'. Say Booking.com as 'Booking dot com'."
    split: {at: booking}
  - text: Rates and availability sync in real time, so every calendar agrees, and double bookings stay in the past.
    pick: c
    direction: "Confident and reassuring; a satisfied smile on 'stay in the past'."
    split: {at: and, n: 2}
  - text: Every guest message lands in one inbox. AI drafts the reply. You just press send.
    pick: b
    direction: Light and easy; three short sentences, the last one with a playful shrug.
    split: {at: ai}
  - text: 'Automations handle the rest: the confirmation, the directions, the review request, each one sent at just the right moment.'
    pick: a
    direction: Smooth and flowing; a crisp little beat after each item in the list.
    split: {at: review, back: 1}
  - text: Smart pricing follows demand, raising your rates on busy nights and filling the quiet ones.
    pick: b
    direction: "Clever and pleased, clear contrast between 'busy nights' and 'the quiet ones'."
    split: {at: raising}
  - text: Before they arrive, guests check in online. They scan their ID, pay the balance, and leave a deposit.
    pick: c
    direction: Clear and friendly; even rhythm through the three steps. Say ID as the two letters I D.
    split: {at: they, n: 2}
  - text: On the day, a door code lets them in, and a digital guidebook answers the small questions.
    pick: c
    gap: 1.05
    direction: Warm and welcoming, relaxed.
    split: {at: and}
  - {text: 'Extras, like a late check-out, are one tap away.', pick: b, direction: A light, playful aside.}
  - text: "Meanwhile, cleanings and check-ins schedule themselves. Your team gets every job on their phone, and sends back photos when it's done."
    pick: a
    direction: "Relaxed and clear, like things quietly taking care of themselves; slight delight on 'schedule themselves'."
    split: {at: your}
  - text: At the end of the month, the accounting is already done. Owner statements, commissions and invoices, calculated for you.
    pick: c
    gap: 1.05
    direction: Calm satisfaction, a relieved smile; even rhythm through the list of three.
    split: {at: owner}
  - {text: Owners follow their bookings with a login of their own., pick: b, direction: Simple and reassuring.}
  - text: Your own booking website brings guests straight to you, with no channel commission to pay.
    pick: b
    direction: Upbeat and proud.
    split: {at: with}
  - {text: And clear reports show how every home is performing., pick: b, gap: 1.15, direction: Clear and bright.}
  - {text: 'All of it at your desk, or in your pocket.', pick: a, gap: 1.5, direction: "Easy and warm; a small smile on 'or in your pocket'."}
  - {text: More than twelve thousand properties already run on Rental Ninja., pick: a, gap: 1.25, direction: 'Proud, warm, quietly impressive.'}
  - {text: 'Getting started takes a day or two, and our team helps you move in.', pick: c, gap: 1.5, direction: 'Friendly and reassuring, welcoming.'}
  - {text: Less busywork. Happier guests. More bookings., pick: c, gap: 1.7, direction: 'Three short, confident statements with a clear pause between each, building.'}
  - {text: 'Rental Ninja. Your whole rental business, in one place.', pick: b, direction: "Final tagline: slower and warm. 'Rental Ninja' as a brand name, a clear pause, then land the line with a smile."}

scenes:   # one scene per line here; the code lives in js/scenes_a..d.js
  - {lines: [1, 1], name: welcome, bg: '#CCE5F1', idea: 'host waves guests into a seaside house'}
  - {lines: [2, 2], name: desk chaos, bg: '#D9D2E3', idea: 'host at a desk buried in tabs, sheets, a buzzing phone'}
  - {lines: [3, 3], name: chores, bg: '#E7DAC9', idea: 'four chore cards drop one per phrase'}
  - {lines: [4, 4], name: double booking, bg: '#F1C3B2', idea: 'two calendars disagree, DOUBLE BOOKING stamp, music stops dead'}
  - {lines: [5, 5], name: calm, bg: '#CFE8F0', idea: 'clutter swept away, calm label'}
  - {lines: [6, 6], name: hub, bg: '#26313B', idea: 'logo hub with five badges'}
  - {lines: [7, 7], name: channels, bg: '#F3D6C8', idea: 'one listing card fans out to channel cards'}
  - {lines: [8, 8], name: sync, bg: '#CFE7DF', idea: 'calendars agree, double booking struck out'}
  - {lines: [9, 9], name: inbox, bg: '#DDD6F0', idea: 'messages fly into one inbox, AI draft, send'}
  - {lines: [10, 10], name: automations, bg: '#F5E5AE', idea: 'timeline chips fire at the right moment'}
  - {lines: [11, 11], name: pricing, bg: '#D2EAD5', idea: 'rate bars rise on busy nights'}
  - {lines: [12, 12], name: check-in, bg: '#CCE5F1', idea: 'phone flow ID, balance, deposit'}
  - {lines: [13, 13], name: arrival, bg: '#F3DDB6', idea: 'keypad code, door opens, guidebook (camAt zoom)'}
  - {lines: [14, 14], name: extras, bg: '#F6D5DC', idea: 'late check-out tap'}
  - {lines: [15, 15], name: team, bg: '#D8E8F5', idea: 'tasks to the cleaner phone, photo back (camAt zoom)'}
  - {lines: [16, 16], name: accounting, bg: '#E6DCF3', idea: 'statement, commissions, invoices'}
  - {lines: [17, 17], name: owners, bg: '#DCEBD0', idea: 'owner with own login'}
  - {lines: [18, 18], name: website, bg: '#CCE5F1', idea: 'direct booking site, no-fee tag'}
  - {lines: [19, 19], name: reports, bg: '#F5E5AE', idea: 'charts per home'}
  - {lines: [20, 20], name: desk and pocket, bg: '#F3D6C8', idea: 'laptop and phone dashboards'}
  - {lines: [21, 21], name: proof, bg: '#CCE5F1', idea: 'hills of tiny houses, 12,500+ and ratings'}
  - {lines: [22, 22], name: onboarding, bg: '#D2EAD5', idea: 'two day pages, team moves you in'}
  - {lines: [23, 23], name: benefits, bg: '#F4ECDD', idea: 'three claim cards'}
  - {lines: [24, 24], name: end card, bg: '#26313B', idea: 'logo, tagline, Book a demo, URL'}

app:
  scripts: [words.js, film.js, hits.js, flat.js, folk.js, world.js, scenes_f1.js, scenes_f2.js, scenes_f3.js, scenes_f4.js, main_flat.js]
  builders: []

render: {fps: 25, out_fps: 25}

music:
  engine: hub                        # composed per film by ElevenLabs Music through the Hub (score <folder> --dry: ~2,600 credits)
  sections:                          # the acts; the end card (line 24) gets the final chord at the film's length
    - {lines: [1, 4], act: problem}
    - {lines: [5, 5], act: turn}
    - {lines: [6, 6], name: Bright Brand Reveal, mood: 'full acoustic pop band enters, bright marimba hook, confident and proud'}
    - {lines: [7, 13], act: features}
    - {lines: [14, 20], name: Sunny Second Theme, mood: 'ukulele strums, glockenspiel melody, bouncy light drum kit, carefree and easy'}
    - {lines: [21, 23], act: proof}
  stops: [{line: 4, word: same, offset: .05}]       # dead stop on the DOUBLE BOOKING stamp, back on the turn's downbeat

mix: {}                              # the outro lift starts on the last word by default
